[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jspace-oversight"
version = "0.1.0"
description = "Research infrastructure for latent-state-informed human oversight"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "JSpace-Oversight contributors"}]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.8"]
interpretability = [
  "torch>=2.5",
  "transformers>=5.5",
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git",
]
agent-eval = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201"]
